<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#18122B"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Subtle Inner Border -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="2"/>

  <!-- Futuristic NEXORA 'N' Monogram with Cyber Spark -->
  <g filter="url(#glow)">
    <!-- Left Pillar -->
    <path d="M144 140 L188 140 L188 372 L144 372 Z" fill="url(#primaryGrad)" rx="8"/>
    
    <!-- Diagonal Energy Beam -->
    <path d="M176 140 L336 348 L336 372 L292 372 L148 184 L148 140 Z" fill="url(#accentGrad)"/>
    
    <!-- Right Pillar -->
    <path d="M324 140 L368 140 L368 372 L324 372 Z" fill="url(#primaryGrad)" rx="8"/>
    
    <!-- AI Core Sparkle (Center) -->
    <circle cx="256" cy="256" r="16" fill="#38bdf8" filter="url(#glow)"/>
    <polygon points="256,220 264,248 292,256 264,264 256,292 248,264 220,256 248,248" fill="#ffffff"/>
  </g>

  <!-- Glowing Accent Dots -->
  <circle cx="166" cy="140" r="7" fill="#38bdf8"/>
  <circle cx="346" cy="372" r="7" fill="#c084fc"/>
</svg>
